Ui design 
Redesign the existing terminal UI of this project into a polished, professional, terminal-native developer tool.

IMPORTANT:
- Keep the application entirely inside the terminal.
- Do NOT convert it into a web UI, GUI, TUI framework, dashboard, browser interface, or desktop application.
- Do NOT change the underlying RAG/retrieval/indexing functionality.
- Do NOT change the existing commands, command semantics, backend logic, retrieval pipeline, indexing logic, or database behavior unless absolutely necessary to support the UI.
- This is a UI/UX refinement of the existing application.
- Preserve all existing functionality.
- First inspect the existing codebase and understand how the current CLI is implemented before making changes.
- Reuse the existing terminal/CLI framework if one is already present rather than introducing an unnecessary new framework.

The desired result should feel like a serious production-grade AI/algorithm developer tool: minimal, technical, fast, elegant, information-dense, and distinctly terminal-native.

--------------------------------------------------
1. PRODUCT NAME / HEADER
--------------------------------------------------

Do NOT use the name "AlgoRAG".

Rename the visible product branding to:

TRACE

Use this as the primary title.

TRACE stands for:

Traceable Retrieval & Context Engine

Subtitle:

Traceable Retrieval & Context Engine
Hybrid Search • Rank Fusion • Grounded Reasoning

The header should be significantly more compact than the current large ASCII-art header.

Use a small/moderate ASCII logo for "TRACE" if the existing implementation supports ASCII art, but do not let the logo consume a large portion of the terminal.

The visual hierarchy should be:

TRACE
Traceable Retrieval & Context Engine
Hybrid Search • Rank Fusion • Grounded Reasoning

Do not make the subtitle brighter than the title.

The title should be the strongest visual element.

--------------------------------------------------
2. OVERALL VISUAL STYLE
--------------------------------------------------

Use a dark terminal aesthetic.

The UI should feel like:

- an advanced developer CLI
- an AI infrastructure/research tool
- a high-quality open-source command-line application
- something a Python/AI engineer would actually use

Avoid:

- excessive decoration
- GUI-like cards
- huge boxes around every line
- gradients
- emojis everywhere
- excessive ASCII art
- excessive colors
- flashy animations
- web-dashboard aesthetics

Use Unicode box-drawing characters where appropriate.

Use whitespace carefully.

The interface should feel calm and deliberate rather than noisy.

The terminal itself is part of the product identity.

--------------------------------------------------
3. COLOR SYSTEM
--------------------------------------------------

Introduce a consistent semantic color system.

PRIMARY BRAND COLOR:
Bright cyan / electric cyan

Use cyan for:
- TRACE title
- important system identifiers
- query prompt indicator
- important numerical metrics
- selected/highlighted information
- source identifiers when appropriate

Do NOT make all text cyan.

SUCCESS:
Green

Use green for:
- successful initialization
- connected services
- completed indexing
- successful operations
- "Ready"
- successful retrieval

COMMAND / ACTION:
Yellow

Use yellow for:
- commands such as /help, /explain, /stats
- actionable hints
- warnings
- attention-required information

RETRIEVAL:
Use blue and purple/magenta to distinguish retrieval stages.

For example:
- BM25 → blue
- Vector Search → purple
- Rank Fusion → magenta
- Reranking → yellow
- Generation/Reasoning → cyan

ERROR:
Red

Use red only for actual errors/failures.

SECONDARY TEXT:
Muted gray / gray-blue

Use this for:
- descriptions
- metadata
- file counts
- secondary information
- hints
- status-bar information

NORMAL CONTENT:
Light gray / near-white

Use this for:
- user query
- answer content
- explanations
- normal terminal output

IMPORTANT COLOR PRINCIPLE:

Colors must have semantic meaning.

Do not color everything brightly.

Cyan = TRACE/product/important interaction
Green = success
Yellow = command/action/warning
Blue/purple/magenta = retrieval pipeline
Red = error
Gray = secondary information
White = primary content

--------------------------------------------------
4. STARTUP EXPERIENCE
--------------------------------------------------

The current startup output is too verbose and looks like raw debugging output.

Turn it into a compact initialization/status section.

Instead of:

Initializing...
Index found...
Loading chunks...
Loading files...
...
Ready...

Make it visually structured like:

  SYSTEM
  ────────────────────────────────────────────────────────────────

  ChromaDB       ● Connected
  BM25 Index     ● Loaded
  Embeddings     ● Ready
  Repository     ● Indexed

  11,859 chunks  │  2,981 files  │  4 languages

  ✓ Ready in 1.84s

Use the actual values from the application dynamically.

Do NOT hardcode these example values.

Preserve the existing initialization logic and simply improve how its status is presented.

Do not claim a service is connected/ready unless it actually is.

If something fails, show it clearly in red.

--------------------------------------------------
5. REMOVE THE LARGE PERMANENT COMMAND BOX
--------------------------------------------------

The current command reference occupies too much vertical space.

Do NOT permanently display a huge command/help panel on startup.

Instead, show a compact command hint:

  Commands: /help  /explain  /category  /index  /stats  /history  /quit

or an equivalent compact presentation.

The full help screen should only appear when the user runs:

/help

Preserve all existing commands.

Do not remove any existing command.

The default screen should prioritize the query and results.

--------------------------------------------------
6. QUERY PROMPT
--------------------------------------------------

Make the query input the primary interaction point.

Instead of:

Type your query or /help for commands

Use something visually stronger such as:

╭─ QUERY ──────────────────────────────────────────────────────────────
│ ❯ _
╰──────────────────────────────────────────────────────────────────────

or an equivalent compact terminal-native prompt.

The exact implementation should match the existing CLI framework.

The "❯" prompt should be bright cyan.

User input should be light/bright white.

Placeholder/help text should be muted gray.

Do not create a large multi-line input box unless the existing CLI framework requires it.

The query interaction should remain fast and natural.

--------------------------------------------------
7. QUERY EXECUTION
--------------------------------------------------

When the user submits a query such as:

  ❯ explain dijkstra's algorithm

the interface should clearly communicate that TRACE is performing retrieval.

Avoid excessive loading animations.

If a loading indicator exists, keep it subtle and terminal-native.

For example:

  Searching...
  Retrieving...
  Fusing results...

Do not print dozens of individual debugging lines.

The final result should be visually clean.

--------------------------------------------------
8. RETRIEVAL TRACE
--------------------------------------------------

This is the MOST IMPORTANT UI improvement.

The project is called TRACE because the system should make the retrieval process understandable.

The UI should visibly expose the retrieval pipeline without overwhelming the user.

After a query, show a compact retrieval trace such as:

╭─ RETRIEVAL TRACE ────────────────────────────────────────────────────╮
│                                                                      │
│  Query                                                               │
│    │                                                                 │
│    ├── BM25 Search          24 candidates                            │
│    ├── Vector Search        20 candidates                            │
│    │                                                                 │
│    └── Rank Fusion          12 candidates                            │
│             │                                                        │
│             └── Top-K          5 chunks                              │
│                                                                      │
╰──────────────────────────────────────────────────────────────────────╯

However, DO NOT invent metrics.

Every number displayed must come from the actual implementation.

If the existing system does not expose a particular metric, either:
- expose it safely from the existing retrieval pipeline, or
- omit the metric.

Never fabricate retrieval scores or candidate counts.

The trace should represent the actual pipeline implemented by the project.

For example, if the real pipeline is:

BM25 + Vector Search → Reciprocal Rank Fusion → reranking → context → LLM

then display that.

If the pipeline differs, display the actual pipeline.

--------------------------------------------------
9. RETRIEVAL COLORS
--------------------------------------------------

Use the following semantic visual differentiation:

BM25:
blue

Vector Search:
purple

Rank Fusion:
magenta

Reranking:
yellow

Context:
gray/white

LLM generation:
cyan

Successful completion:
green

This should be subtle.

Do not create rainbow-colored output.

The purpose is to make the retrieval architecture understandable at a glance.

--------------------------------------------------
10. ANSWER SECTION
--------------------------------------------------

The generated answer should appear under a clear section:

╭─ ANSWER ─────────────────────────────────────────────────────────────╮
│                                                                      │
│ Dijkstra's algorithm computes the shortest path from a source       │
│ vertex to every other reachable vertex in a graph with              │
│ non-negative edge weights.                                          │
│                                                                      │
│ Complexity                                                           │
│   Time     O((V + E) log V)                                         │
│   Space    O(V)                                                     │
│                                                                      │
╰──────────────────────────────────────────────────────────────────────╯

This is only an example.

Use the actual generated answer.

Do not artificially force every answer into a rigid template.

The answer should remain readable as natural text.

Preserve Markdown/code formatting if the current application supports it.

--------------------------------------------------
11. SOURCE / PROVENANCE SECTION
--------------------------------------------------

The source section is extremely important.

TRACE should clearly show where the answer came from.

Use a compact format such as:

  SOURCES
  ────────────────────────────────────────────────────────────────────

  [01] cpp/graphs/dijkstra.cpp
       relevance  0.94

  [02] python/graphs/dijkstra.py
       relevance  0.89

  [03] cpp/graphs/shortest_path.cpp
       relevance  0.86

Again:

DO NOT fabricate relevance scores.

Only display scores if they are actually calculated by the system.

If the system has multiple retrieval scores available, optionally show:

       BM25 0.91 │ Vector 0.88 │ Fusion 0.94

but only when those values are actually available.

The source paths should be visually distinct from the explanatory text.

The source list should make it immediately obvious that the answer is grounded in repository material.

--------------------------------------------------
12. RETRIEVAL SUMMARY
--------------------------------------------------

After the answer or source list, optionally show a very compact trace summary:

  TRACE
  ────────────────────────────────────────────────────────────────────
  Retrieved 5 chunks │ Sources 3 │ Fusion score 0.91

Again, only show metrics that actually exist.

Do NOT call something "confidence" unless it is genuinely a confidence score.

Prefer accurate terms such as:

- Retrieved chunks
- Sources
- Fusion score
- Retrieval score
- Reranked results

depending on what the backend actually calculates.

