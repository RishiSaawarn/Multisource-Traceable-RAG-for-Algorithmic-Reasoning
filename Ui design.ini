--------------------------------------------------
16. SPACING AND TERMINAL WIDTH
--------------------------------------------------

The UI must work well at common terminal sizes.

Design primarily for approximately:

80 columns minimum
120 columns ideal

Do not assume an ultra-wide terminal.

Avoid horizontal overflow.

Avoid excessive blank space.

Avoid cramming information.

Use adaptive formatting where practical.

If the terminal is narrow, simplify optional metadata rather than breaking the layout.

--------------------------------------------------
17. BOX DESIGN
--------------------------------------------------

Do NOT put a box around every single element.

Use boxes only for major sections:

- QUERY
- RETRIEVAL TRACE
- ANSWER

Use simple dividers for:

- SOURCES
- STATUS
- COMMANDS

This prevents the terminal from looking like a GUI.

Use Unicode box drawing:

╭ ╮ ╰ ╯ │ ─ ├ ┤

where supported.

Gracefully fall back to ASCII if the terminal does not support Unicode.

--------------------------------------------------
18. ICONS
--------------------------------------------------

Keep icons extremely limited.

Good:

✓ successful
● status
❯ prompt
→ pipeline

Avoid filling the UI with emojis.

The current wrench/rocket/checkmark style should be toned down.

This is an engineering tool, not a consumer chatbot.

--------------------------------------------------
19. ANIMATIONS / SPINNERS
--------------------------------------------------

If loading animations already exist, make them subtle.

Do not add flashy animations.

The application should feel fast.

A simple:

  ⠋ Retrieving...

is enough if the existing framework supports it.

After completion, replace it with:

  ✓ Retrieved

Do not leave excessive logs in the terminal.

--------------------------------------------------
20. ERROR HANDLING
--------------------------------------------------

Errors should be highly readable.

Example:

  ✗ Retrieval failed

  ChromaDB connection unavailable.

  Hint: verify the configured database connection.

Do not dump a huge traceback by default.

However, preserve a mechanism for developers to access the actual exception/debug information if the current application already supports it.

Do not hide errors.

--------------------------------------------------
