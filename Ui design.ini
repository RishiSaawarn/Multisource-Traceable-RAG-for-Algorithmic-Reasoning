--------------------------------------------------
27. SUCCESS CRITERIA
--------------------------------------------------

After implementation, verify:

- Application still runs entirely in terminal.
- All existing commands still work.
- Queries still return the same underlying results.
- Retrieval pipeline is unchanged.
- Indexing still works.
- /stats works.
- /history works.
- /category works.
- /help works.
- /quit works.
- No fake retrieval metrics are displayed.
- No hardcoded repository statistics are displayed.
- No unnecessary web/GUI dependencies are introduced.
- Terminal width does not cause major layout problems.
- Colors are consistent and semantic.
- Startup output is substantially cleaner.
- The default screen gives much more space to query/results.
- Retrieval provenance is clearly visible.
- The product branding is "TRACE", not "AlgoRAG".

Most importantly:

DO NOT overdesign it.

It should look like a sophisticated CLI used by an engineer/researcher, not a website rendered inside a terminal.