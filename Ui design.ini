--------------------------------------------------
15. /STATS UI
--------------------------------------------------

Improve /stats so it feels like a terminal diagnostic view.

Example:

  INDEX STATISTICS
  ────────────────────────────────────────────────────────────────────

  Chunks             11,859
  Files               2,981
  Languages               4
  Categories              8

  LANGUAGES
  ────────────────────────────────────────────────────────────────────

  C++       ████████████████████     371
  Python    ███████████████████████  1,383
