If progress counts exist, show them.

--------------------------------------------------
24. IMPORTANT: DO NOT CHANGE THE ARCHITECTURE
--------------------------------------------------

Do not rewrite the application architecture merely to implement the visual changes.

Do not replace:
- ChromaDB
- BM25
- embeddings
- Groq/LLM integration
- existing retrieval implementation
- existing indexing pipeline
- existing Python architecture

unless required by an existing bug.

The purpose of this task is to improve the CLI presentation and UX.

--------------------------------------------------
25. IMPORTANT: PRESERVE FUNCTIONALITY
--------------------------------------------------

Before changing code:

1. Inspect the project structure.
2. Identify the CLI entry point.
3. Identify the current rendering/output functions.
4. Identify how queries are processed.
5. Identify what retrieval metrics are actually available.
6. Identify how sources are currently returned.
7. Identify all existing commands.
8. Identify how terminal colors/styles are currently implemented.

Then modify the UI layer as cleanly as possible.

Do not duplicate business logic.

Create reusable rendering/helper functions if appropriate.

For example:

render_header()
render_status()
render_query_prompt()
render_retrieval_trace()
render_answer()
render_sources()
render_status_bar()
render_help()
render_stats()

Use the project's existing conventions if it already has equivalent abstractions.

