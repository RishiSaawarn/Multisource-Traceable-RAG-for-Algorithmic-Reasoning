  QUERY HISTORY
  ────────────────────────────────────────────────────────────────────

  01  explain dijkstra's algorithm
  02  stable in-place sorting algorithms
  03  detect cycle in directed graph
  04  bfs vs dfs

Use actual history data.

Allow the existing behavior to remain unchanged.

